name: Deploy ShuleHub Vue

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      # =====================================================
      # CHECKOUT SOURCE CODE
      # =====================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # =====================================================
      # SETUP NODE
      # =====================================================
      - name: Setup Node
        uses: actions/setup-node@v4

        with:
          node-version: 22
          cache: npm

      # =====================================================
      # INSTALL AND BUILD WITH RETRIES
      # =====================================================
      - name: Build Application

        uses: nick-fields/retry@v3

        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 15

          command: |
            npm ci
            npm run build

      # =====================================================
      # VERIFY DIST EXISTS
      # =====================================================
      - name: Verify dist

        run: |

          echo "Listing dist..."

          ls -la dist/

          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html was not built."
            exit 1
          fi

      # =====================================================
      # PREPARE SSH KEY
      # =====================================================
      - name: Prepare SSH Key

        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # =====================================================
      # CREATE REMOTE TEMP DIRECTORY
      # =====================================================
      - name: Prepare VPS Temp Directory

        uses: nick-fields/retry@v3

        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10

          command: |

            ssh \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/id_rsa \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
              "mkdir -p /tmp/school-management-vue"

      # =====================================================
      # UPLOAD DIST TO VPS WITH RETRIES
      # =====================================================
      - name: Upload dist to VPS

        uses: nick-fields/retry@v3

        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 20

          command: |

            scp -r \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/id_rsa \
              dist \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/tmp/school-management-vue/

      # =====================================================
      # DEPLOY APPLICATION WITH SSH RETRIES
      # =====================================================
      - name: Deploy Application

        uses: nick-fields/retry@v3

        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 20

          command: |

            cat > deploy.sh << 'EOF'
            set -e

            APP_DIR="/opt/apps/school-management-vue"
            BACKUP_DIR="/opt/apps/school-management-vue/backup"
            TEMP_DIR="/tmp/school-management-vue"

            echo "========================================="
            echo "STARTING DEPLOYMENT"
            echo "========================================="

            echo "Logged in as $(id -un) ($(id -u))"

            echo "Checking uploaded files..."

            ls -la "$TEMP_DIR/dist"

            if [ ! -f "$TEMP_DIR/dist/index.html" ]; then
              echo "ERROR: dist/index.html was not uploaded."
              exit 1
            fi

            echo "Creating application directories..."

            if ! mkdir -p "$APP_DIR" "$BACKUP_DIR"; then
              echo "ERROR: $(id -un) cannot create $APP_DIR."
              exit 1
            fi

            echo "Backing up the current site if present..."

            if [ -f "$APP_DIR/index.html" ]; then

              TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
              ARCHIVE="$BACKUP_DIR/shulehub-vue-$TIMESTAMP"

              mkdir -p "$ARCHIVE"

              find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name backup -exec cp -a {} "$ARCHIVE/" \;

              echo "Backup created:"
              echo "$ARCHIVE"

            else

              echo "No existing site found."

            fi

            echo "Removing the previous site files..."

            find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name backup -exec rm -rf {} +

            echo "Copying the new site..."

            cp -a "$TEMP_DIR/dist/." "$APP_DIR/"

       
            echo "Cleaning temporary files..."

            rm -rf /tmp/school-management-vue

            if [ ! -f "$APP_DIR/index.html" ]; then
              echo "ERROR: $APP_DIR/index.html is missing after copy."
              exit 1
            fi

            echo "========================================="
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "========================================="
            echo "Site files are in $APP_DIR"
            EOF

            chmod +x deploy.sh

            ssh \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/id_rsa \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
              'bash -s' < deploy.sh

      # =====================================================
      # SUCCESS MESSAGE
      # =====================================================
      - name: Deployment Success

        run: |
          echo "Deployment completed successfully."
