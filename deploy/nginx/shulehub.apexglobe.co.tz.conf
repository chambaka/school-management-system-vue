# /etc/nginx/sites-available/shulehub.apexglobe.co.tz
#
# Live files: /var/www/shulehub.apexglobe.co.tz/current
# API:        http://127.0.0.1:8989
# Locations:  http://127.0.0.1:8586  (/api/v1/location -> /api/location)
#
# Install:
#   sudo cp deploy/nginx/shulehub.apexglobe.co.tz.conf /etc/nginx/sites-available/shulehub.apexglobe.co.tz
#   sudo ln -sfn /etc/nginx/sites-available/shulehub.apexglobe.co.tz /etc/nginx/sites-enabled/shulehub.apexglobe.co.tz
#   sudo nginx -t && sudo systemctl reload nginx
#
# After nginx -t passes, issue the certificate. Certbot adds HTTPS itself:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d shulehub.apexglobe.co.tz

server {
    listen 80;
    listen [::]:80;
    server_name shulehub.apexglobe.co.tz;

    root /var/www/shulehub.apexglobe.co.tz/current;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;

    location /api/v1/location/ {
        proxy_pass http://127.0.0.1:8586/api/location/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8989;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
