# /etc/nginx/sites-available/shulehub.apexglobe.co.tz
#
# Live files: /var/www/shulehub.apexglobe.co.tz/current
# API:        http://127.0.0.1:8989
# Locations:  http://127.0.0.1:8586  (/api/v1/location -> /api/location)
#
# Install:
#   sudo cp deploy/nginx/shulehub.apexglobe.co.tz.conf /etc/nginx/sites-available/shulehub.apexglobe.co.tz
#   sudo ln -sfn /etc/nginx/sites-available/shulehub.apexglobe.co.tz /etc/nginx/sites-enabled/shulehub.apexglobe.co.tz
#   sudo nginx -t && sudo systemctl reload nginx
#
# Issue the certificate once, if it is not already present:
#   sudo certbot --nginx -d shulehub.apexglobe.co.tz

server {
    listen 80;
    listen [::]:80;
    server_name shulehub.apexglobe.co.tz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shulehub.apexglobe.co.tz;

    ssl_certificate /etc/letsencrypt/live/shulehub.apexglobe.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shulehub.apexglobe.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/shulehub.apexglobe.co.tz/current;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;

    location /api/v1/location/ {
        proxy_pass http://127.0.0.1:8586/api/location/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8989;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
